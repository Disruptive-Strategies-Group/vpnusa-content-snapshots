title = "DSG Gitleaks config"

# Compatible with gitleaks 8.18.4 (singular [allowlist] syntax; plural
# [[allowlists]] requires 8.25+).

[extend]
useDefault = true

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = "(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
tags = ["key", "aws"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = "-----BEGIN\\s+(?:RSA\\s+|DSA\\s+|EC\\s+|OPENSSH\\s+)?PRIVATE\\s+KEY-----"
tags = ["key", "private-key"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|secret|token|password|auth)['"]?[\s:=]+['"][0-9a-zA-Z\-_+/=]{20,}['"]'''
entropy = 3.5
tags = ["key"]

[allowlist]
description = "Safe patterns that are not credentials"
regexes = [
 "123456789012",
 "arn:aws:secretsmanager:[a-z0-9-]+:[0-9]+:secret:[a-zA-Z0-9_-]+",
 "^12[0-9]{14}$",
]
paths = [
 # Vendored / generated build output and dependencies
 "(^|/)\\.aws-sam/",
 "(^|/)node_modules/",
 "site-packages/",
 "\\.dist-info/",
 "(^|/)dist/",
 "(^|/)build/",
 # Documentation and narrow JSON allowlist (blanket *.json removed so
 # real secrets in JSON files are still detected)
 ".*\\.md$",
 "(^|/)package-lock\\.json$",
 "(^|/)tsconfig[^/]*\\.json$",
 "test/",
 "tests/",
 "deliverables/",
 "reports/"
]
