name: DSG Coding Agent
description: >-
  Agentic coding loop using OpenRouter (or compatible OpenAI-format API).
  Reads issue context, follows the approved plan, edits files, and commits locally.
  Does NOT push or create PRs — the calling workflow handles that.

inputs:
  api-key:
    description: API key for the LLM provider (OpenRouter, OpenAI, etc). Not needed when provider is bedrock.
    required: false
    default: ""
  issue-context:
    description: Path to the issue context JSON file (.agent/issue-context.json).
    required: true
  branch-name:
    description: Git branch the agent is working on.
    required: true
  issue-number:
    description: GitHub issue number for commit messages.
    required: true
  issue-title:
    description: GitHub issue title for commit messages.
    required: false
    default: ""
  max-turns:
    description: Maximum number of agentic loop iterations.
    required: false
    default: "120"
  mode:
    description: "'implement' (default) or 'revise'. Revise mode uses a revision-focused prompt."
    required: false
    default: "implement"
  review-concerns:
    description: "Review concerns text to address (used in revise mode only)."
    required: false
    default: ""
  required-files:
    description: >-
      JSON-encoded array of file paths the agent must restrict its changes to
      (used by the PR revise workflow to keep revisions on-target). Default '*'
      means no restriction.
    required: false
    default: "*"
  model:
    description: Model identifier (e.g. deepseek/deepseek-v4-flash-0731, gpt-4o).
    required: false
    default: "deepseek/deepseek-v4-flash-0731"
  escalation-model:
    description: Model to escalate to when the primary model hits no_progress (e.g. deepseek/deepseek-v4-pro).
    required: false
    default: "deepseek/deepseek-v4-pro"
  api-base-url:
    description: Base URL for the OpenAI-compatible API.
    required: false
    default: "https://openrouter.ai/api/v1"
  provider:
    description: "'openai' (default; any OpenAI-compatible API) or 'bedrock' (AWS Bedrock Converse, US-only, uses the job's AWS credentials)."
    required: false
    default: "openai"
  bedrock-region:
    description: AWS region for Bedrock calls when provider is bedrock.
    required: false
    default: "us-east-2"

outputs:
  outcome:
    description: "'success' if the agent completed normally, 'failure' if it hit max_turns or errored."
    value: ${{ steps.agent.outputs.outcome }}
  turns_used:
    description: Number of agentic loop turns consumed.
    value: ${{ steps.agent.outputs.turns_used }}
  exit-code:
    description: "agent.py exit code (0=ok, 3=error_loop, 4=no_progress, other=agent_error)"
    value: ${{ steps.agent.outputs.exit_code }}
  usage-json:
    description: >-
      JSON summary of per-model LLM token usage, call counts and estimated
      cost (USD) for the run; empty when no LLM call succeeded. Consumed by
      caller workflows to publish DSG/CICD CloudWatch metrics.
    value: ${{ steps.agent.outputs.usage-json }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        pip install --quiet "openai>=1.30.0" "httpx>=0.23.0"
        if [ "${{ inputs.provider }}" = "bedrock" ]; then
          pip install --quiet "boto3>=1.35.0"
        fi

    - name: Install test dependencies (if any)
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:-$(pwd)}"

        # Directories at depth 0, 1 and 2 (root, x/, x/y/), excluding non-source directories.
        mapfile -t DIRS < <(
          find . -maxdepth 2 \
            \( -name .git -o -name node_modules -o -name .venv -o -name venv \
               -o -name .agent -o -name cdk.out -o -name .aws-sam -o -name .terraform \) \
            -prune -o -type d -print | sort
        )

        # Repo root: requirements-test.txt, else requirements.txt (unchanged behavior).
        if [ -f requirements-test.txt ]; then
          pip install --quiet -r requirements-test.txt
        elif [ -f requirements.txt ]; then
          pip install --quiet -r requirements.txt
        fi

        # Nested directories: install requirements-test.txt if present; otherwise, if the
        # directory has a requirements.txt AND contains tests, install it as a fallback so
        # tests that import the nested directory's production modules can run. The fallback
        # install must never fail the step (some requirements files need system libraries).
        for d in "${DIRS[@]}"; do
          if [ "$d" != "." ] && [ -f "$d/requirements-test.txt" ]; then
            pip install --quiet -r "$d/requirements-test.txt"
          elif [ "$d" != "." ] && [ -f "$d/requirements.txt" ] && \
               { [ -d "$d/tests" ] || [ -n "$(find "$d" -maxdepth 1 -name 'test_*.py' -print -quit)" ]; }; then
            pip install --quiet -r "$d/requirements.txt" || echo "::warning::could not install $d/requirements.txt; tests importing $d may fail"
          fi
        done

        # PYTHONPATH additions: <abs dir>/src for every scanned directory whose src/ contains a .py file.
        EXTRA=""
        for d in "${DIRS[@]}"; do
          if [ -d "$d/src" ] && [ -n "$(find "$d/src" -name '*.py' -print -quit)" ]; then
            abs_src="$(cd "$d" && pwd)/src"
            EXTRA="${EXTRA:+${EXTRA}:}${abs_src}"
          fi
        done
        echo "AGENT_EXTRA_PYTHONPATH=${EXTRA}" >> "$GITHUB_ENV"

    - name: Run coding agent
      id: agent
      shell: bash
      env:
        AGENT_API_KEY: ${{ inputs.api-key }}
        AGENT_API_BASE_URL: ${{ inputs.api-base-url }}
        AGENT_PROVIDER: ${{ inputs.provider }}
        AGENT_BEDROCK_REGION: ${{ inputs.bedrock-region }}
        AGENT_MODEL: ${{ inputs.model }}
        AGENT_ESCALATION_MODEL: ${{ inputs.escalation-model }}
        AGENT_ISSUE_CONTEXT: ${{ inputs.issue-context }}
        AGENT_BRANCH_NAME: ${{ inputs.branch-name }}
        AGENT_ISSUE_NUMBER: ${{ inputs.issue-number }}
        AGENT_ISSUE_TITLE: ${{ inputs.issue-title }}
        AGENT_MAX_TURNS: ${{ inputs.max-turns }}
        AGENT_MODE: ${{ inputs.mode }}
        AGENT_REVIEW_CONCERNS: ${{ inputs.review-concerns }}
        AGENT_REQUIRED_FILES: ${{ inputs.required-files }}
      run: |
        set -euo pipefail
        set +e
        export PYTHONPATH="${{ github.action_path }}${AGENT_EXTRA_PYTHONPATH:+:${AGENT_EXTRA_PYTHONPATH}}"
        python3 "${{ github.action_path }}/agent.py" 2>&1 | tee -a /tmp/agent-stdout.log
        rc=${PIPESTATUS[0]}
        set -e
        echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
        exit "${rc}"
