name: Agent PR Revise

on:
  pull_request_review:
    types: [submitted]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  revise:
    name: revise
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'CHANGES_REQUESTED' &&
      (
        github.event.review.user.login == 'dsgowenjward' ||
        github.event.review.user.login == 'dsg-mcp-server[bot]' ||
        github.event.review.user.login == 'dsg-commenter[bot]' ||
        github.event.review.user.login == 'dsg-agentic-assistant[bot]'
      ) &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    timeout-minutes: 45

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DSG_AGENTIC_APP_ID }}
          private-key: ${{ secrets.DSG_AGENTIC_PRIVATE_KEY }}

      - name: Parse PR metadata
        id: meta
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const headRef  = context.payload.pull_request.head.ref;
            const baseRef  = context.payload.pull_request.base.ref;
            const headSha  = context.payload.pull_request.head.sha;

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_ref', headRef);
            core.setOutput('base_ref', baseRef);
            core.setOutput('head_sha', headSha);
            core.info(`PR #${prNumber}: ${headRef} → ${baseRef} @ ${headSha}`);

      - name: Check blocked:non-substantive label
        id: blocked_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');

            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: prNumber, per_page: 100
            });
            const blocked = labels.some(l => (l.name || '') === 'blocked:non-substantive');
            core.setOutput('blocked', String(blocked));
            core.info(`blocked:non-substantive label present: ${blocked}`);
            if (blocked) {
              core.warning('PR is blocked — further automatic revision cycles are paused until an admin removes the label.');
            }

      - name: Revision cycle guard
        if: steps.blocked_check.outputs.blocked != 'true'
        id: cycle_guard
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100
            });
            const GATE_1_IDENTITIES = [
              'github-actions[bot]',
              'dsg-agentic-assistant[bot]',
              'dsg-mcp-server[bot]',
              'dsg-commenter[bot]',
              'dsgowenjward',
            ];
            const botReviews = reviews.filter(
              r => r.state === 'CHANGES_REQUESTED' &&
                   GATE_1_IDENTITIES.includes(r.user.login)
            );

            // The triggering review is already in the list, so threshold is > 2
            const cycleCount = botReviews.length;
            core.info(`Revision cycle count: ${cycleCount}`);

            if (cycleCount > 2) {
              // Fetch current PR title and update to 🔴 [AGENT:BLOCKED]
              const prData = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const currentTitle = prData.data.title || '';
              const RED = '🔴'; // 🔴
              const cleaned = currentTitle.replace(/^[🟡🔵🟢\uD83DĴ]?\s*\[AGENT:[^\]]+\]\s*/iu, '').trim();
              const newTitle = RED + ' [AGENT:BLOCKED] ' + cleaned;
              await github.rest.pulls.update({ owner, repo, pull_number: prNumber, title: newTitle });

              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `<!-- AGENT_VERDICT --> ESCALATE — Max revision cycles (3) reached. Human review required.`
              });
              core.setOutput('escalate', 'true');
            } else {
              core.setOutput('escalate', 'false');
            }

      - name: Exit if escalating or blocked
        if: steps.cycle_guard.outputs.escalate == 'true' || steps.blocked_check.outputs.blocked == 'true'
        run: |
          if [ "${{ steps.cycle_guard.outputs.escalate }}" = "true" ]; then
            echo "Max revision cycles reached — escalating to human. Exiting."
          else
            echo "PR is blocked by 'blocked:non-substantive' label — manual intervention required. Exiting."
          fi
          exit 0

      - name: Fetch review concerns
        if: steps.blocked_check.outputs.blocked != 'true'
        id: concerns
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');
            const headSha  = '${{ steps.meta.outputs.head_sha }}';

            const GATE_1_IDENTITIES = [
              'github-actions[bot]',
              'dsg-agentic-assistant[bot]',
              'dsg-mcp-server[bot]',
              'dsg-commenter[bot]',
              'dsgowenjward',
            ];

            // Fetch the head commit timestamp so we can filter to only reviews
            // submitted AFTER this commit was pushed. This prevents stale concerns
            // from prior revise rounds from being re-sent to Claude when they have
            // already been addressed in the current branch state.
            let headCommitTimestamp = null;
            try {
              const commitData = await github.rest.repos.getCommit({
                owner, repo, ref: headSha
              });
              headCommitTimestamp = commitData.data.commit.committer.date;
              core.info(`Head commit (${headSha.slice(0, 8)}) committed at: ${headCommitTimestamp}`);
            } catch (e) {
              core.warning(`Could not fetch head commit timestamp: ${e.message}. Falling back to all reviews.`);
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100
            });

            const concernReviews = reviews.filter(
              r => r.state === 'CHANGES_REQUESTED' &&
                   GATE_1_IDENTITIES.includes(r.user.login) &&
                   r.body && r.body.trim() &&
                   // Only include reviews submitted after the current head commit was pushed.
                   // If we couldn't fetch the timestamp, fall back to including all reviews.
                   (headCommitTimestamp === null || new Date(r.submitted_at) > new Date(headCommitTimestamp))
            );

            // Sort oldest-first so Claude sees concerns in chronological order
            concernReviews.sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at));

            const concerns = concernReviews
              .map((r, i) => `--- Review ${i + 1} (${r.user.login}, ${r.submitted_at}) ---\n${r.body.trim()}`)
              .join('\n\n');

            if (!concerns.trim()) {
              core.setOutput('no_concerns', 'true');
              core.warning('No CHANGES_REQUESTED reviews with content found after head commit timestamp.');
            } else {
              core.setOutput('no_concerns', 'false');
            }
            core.setOutput('concerns', concerns);
            core.info(`Concerns aggregated from ${concernReviews.length} review(s) (${concerns.length} chars)`);

      - name: Exit if no actionable concerns
        if: steps.blocked_check.outputs.blocked != 'true' && steps.concerns.outputs.no_concerns == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: '<!-- AGENT_PR_REVISED -->\nNo actionable review concerns were found. No changes were made.'
            });
            core.info('No concerns — exiting early.');

      - name: Parse Gate 1 feedback for flagged file paths
        id: feedback_parse
        if: >
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true'
        shell: bash
        env:
          CONCERNS: ${{ steps.concerns.outputs.concerns }}
        run: |
          set -euo pipefail

          CONCERNS="${CONCERNS:-}"

          # Extract file paths mentioned in the Gate 1 CHANGES_REQUESTED feedback.
          # Matches any path-like token ending with a dot and 1-10 alphabetic chars
          # to cover all common code/config file extensions (.ts, .py, .tf, .html, etc.)
          # Note: -P (PCRE) is used because GNU grep's ERE mode mishandles \w
          # inside a bracket expression; ubuntu-latest runners ship PCRE-enabled grep.
          FILES="$(printf '%s\n' "${CONCERNS}" | grep -oP '\b[\w-]+/[\w./-]+\.[a-zA-Z][a-zA-Z0-9]{0,9}\b' | sort -u || true)"

          if [ -z "${FILES}" ]; then
            echo "no_files=false" >> "$GITHUB_OUTPUT"
            echo "required_files=[]" >> "$GITHUB_OUTPUT"
            echo "No flagged file paths found in review feedback. Proceeding with full concerns text."
          else
            echo "no_files=false" >> "$GITHUB_OUTPUT"
            REQUIRED_JSON="$(printf '%s\n' "${FILES}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            echo "required_files=${REQUIRED_JSON}" >> "$GITHUB_OUTPUT"
            echo "Flagged file paths extracted from review feedback:"
            printf '%s\n' "${FILES}"
          fi

      - name: Exit if no flagged file paths
        if: >
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: [
                '<!-- AGENT_REVISE_MANUAL_REVIEW -->',
                '⚠️ **Manual review required** — review feedback did not mention any recognizable file paths,',
                'so the revision cannot be validated automatically.',
                '',
                'A human reviewer must clarify the requested files or proceed manually.'
              ].join('\n')
            });
            core.info('No flagged file paths found — exiting early.');

      - name: Checkout PR branch
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.meta.outputs.head_ref }}
          fetch-depth: 0

      - name: Configure git identity
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        run: |
          git config user.name  "dsg-bot"
          git config user.email "dsg-bot@users.noreply.github.com"

      - name: Gather linked issue context
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          gh_with_retry() {
            local max_retries=3
            local attempt=0
            while [ $attempt -le $max_retries ]; do
              attempt=$((attempt + 1))
              local output
              output=$(gh "$@" 2>&1) && {
                echo "$output"
                return 0
              }
              local rc=$?
              if echo "$output" | grep -qi "secondary rate limit\|rate limit\|Something went wrong\|GraphQL:\|Internal Server Error\|502 Bad Gateway\|503 Service Unavailable\|504 Gateway Timeout\|connection reset\|EOF" && [ $attempt -le $max_retries ]; then
                local wait=$((attempt * 30))
                echo "GitHub rate limit hit on attempt $attempt. Waiting ${wait}s before retry..."
                sleep $wait
                continue
              fi
              echo "$output" >&2
              return $rc
            done
          }

          mkdir -p .agent

          # Parse PR body for "Closes #N" or "Fixes #N"
          PR_BODY="$(gh_with_retry pr view "${{ steps.meta.outputs.pr_number }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json body --jq '.body')"

          LINKED_ISSUE="$(echo "${PR_BODY}" | grep -oiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | head -1 || true)"

          # Guard against issue number 0 — GitHub issue numbers start at 1.
          # "Closes #0" in a PR body (e.g. a placeholder comment) would otherwise
          # cause `gh issue view 0` to fail with a GraphQL error and exit 1.
          if [ -n "${LINKED_ISSUE}" ] && [ "${LINKED_ISSUE}" != "0" ]; then
            echo "Linked issue: #${LINKED_ISSUE}"
            gh_with_retry issue view "${LINKED_ISSUE}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json title,body,comments \
              > .agent/issue-context.json
          else
            echo "No linked issue found; writing stub."
            echo '{"title":"(no linked issue)","body":"","comments":[]}' > .agent/issue-context.json
          fi

      - name: Capture pre-push SHA
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        id: pre_push_sha
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "pre_push_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Pre-push SHA: ${sha}"

      - name: Configure AWS credentials (OIDC)
        id: aws
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Fetch OpenRouter key from Secrets Manager
        id: creds
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        shell: bash
        env:
          INTEGRATIONS_SECRET_ARN: ${{ secrets.INTEGRATIONS_SECRET_ARN }}
        run: |
          set -euo pipefail
          KEY=$(aws secretsmanager get-secret-value \
            --secret-id "${INTEGRATIONS_SECRET_ARN}" \
            --query SecretString --output text | jq -r '.openrouter_api_key // empty')
          if [ -z "${KEY}" ]; then
            echo "ERROR: openrouter_api_key not readable from INTEGRATIONS_SECRET_ARN"
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "OPENROUTER_API_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Revision agent
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        id: claude
        continue-on-error: true
        uses: ./.github/actions/coding-agent
        with:
          api-key: ${{ env.OPENROUTER_API_KEY }}
          issue-context: .agent/issue-context.json
          branch-name: ${{ steps.meta.outputs.head_ref }}
          issue-number: ${{ steps.meta.outputs.pr_number }}
          max-turns: "25"
          mode: revise
          review-concerns: ${{ steps.concerns.outputs.concerns }}
          required-files: ${{ steps.feedback_parse.outputs.required_files }}

      - name: Warn if Claude Code failed
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true' &&
          steps.claude.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: [
                '<!-- AGENT_REVISE_ERROR -->',
                '⚠️ **Agent step failed during revision** — no code changes were made. The workflow may have attempted a safety-net/no-op commit to keep CI alive; check the [workflow run logs](' +
                  `https://github.com/${owner}/${repo}/actions/runs/${{ github.run_id }}` +
                  ') to confirm whether a commit was actually pushed.'
              ].join('\n')
            });

      - name: Safety-net commit and cleanup
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Never allow agent to modify canonical control files — leave repo-specific workflows untouched
          for f in ci.yml code-agent.yml issue-deploy-lifecycle.yml lifecycle-bootstrap.yml agent-pr-ci-summary.yml agent-pr-revise.yml agent-pr-review.yml agent-pr-claude-verdict.yml agent-merge.yml agent-design-qa.yml; do
            git restore --staged --worktree ".github/workflows/${f}" 2>/dev/null || true
          done
          rm -rf .agent .claude-pr

          # Remove tracked __pycache__ directories and .pyc files to prevent accidental binary commits
          find . -path '*/__pycache__/*.pyc' -exec git rm --cached --quiet {} \; 2>/dev/null || true
          find . -name '*.pyc' -exec git rm --cached --quiet {} \; 2>/dev/null || true
          find . -type d -name '__pycache__' -exec git rm --cached --quiet -r {} \; 2>/dev/null || true

          # Commit any uncommitted working tree changes left by Claude.
          # Guard on stageability after `git add -A` rather than on porcelain,
          # so a dirty-but-nothing-stageable tree does not fail the step.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree changes detected; creating safety-net commit."
            git add -A
            git diff --cached --quiet || git commit -m "safety net: capture any uncommitted changes"
          else
            echo "No changes to commit."
          fi

          # Fallback: if this run produced no new commit, force a no-op commit to re-trigger CI
          PRE_PUSH_SHA="${{ steps.pre_push_sha.outputs.pre_push_sha }}"
          CURRENT_SHA="$(git rev-parse HEAD)"

          if [ "${CURRENT_SHA}" = "${PRE_PUSH_SHA}" ]; then
            echo "No new commits produced this run — creating no-op commit to re-trigger CI."
            echo "# agent-pr-revise no-op: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .agent-noop
            git add .agent-noop
            git commit -m "chore: re-trigger CI after revision cycle (no changes needed)"
          fi

      - name: Push branch
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${{ steps.meta.outputs.head_ref }}"

      - name: Capture post-revision diff
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true'
        id: actual_diff
        shell: bash
        run: |
          set -euo pipefail
          PRE_SHA="${{ steps.pre_push_sha.outputs.pre_push_sha }}"
          POST_SHA="$(git rev-parse HEAD)"
          echo "post_sha=${POST_SHA}" >> "$GITHUB_OUTPUT"

          if [ "${PRE_SHA}" = "${POST_SHA}" ]; then
            echo "diff_summary=No file changes were made this revision cycle." >> "$GITHUB_OUTPUT"
          else
            DIFF="$(git diff "${PRE_SHA}".."${POST_SHA}" -- . ':(exclude).agent-noop' | head -200)"
            if [ -z "${DIFF}" ]; then
              echo "diff_summary=No file changes were made this revision cycle." >> "$GITHUB_OUTPUT"
            else
              echo "${DIFF}" > /tmp/agent_diff.txt
               {
                echo 'diff_summary<<EOF'
                cat /tmp/agent_diff.txt
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Verify revision addresses flagged files
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true' &&
          steps.claude.outcome == 'success'
        id: substantive
        shell: bash
        env:
          REQUIRED_FILES: ${{ steps.feedback_parse.outputs.required_files }}
          PRE_SHA: ${{ steps.pre_push_sha.outputs.pre_push_sha }}
          CONCERNS: ${{ steps.concerns.outputs.concerns }}
        run: |
          set -euo pipefail

          PRE_SHA="${PRE_SHA:-}"
          if [ -n "${PRE_SHA}" ]; then
            CHANGED="$(git diff --name-only "${PRE_SHA}"..HEAD || true)"
          else
            CHANGED="$(git diff --name-only HEAD~1 || true)"
          fi

          echo "Changed files in this revision:"
          printf '%s\n' "${CHANGED}"

          # Extract search terms from the Gate 1 feedback: any quoted tokens
          # (e.g. "fpc", "FPC", "604860202807") become an alternation pattern
          # used to test whether a flagged file still contains the problematic
          # content. If no quoted terms exist, the pattern stays empty and the
          # revision is treated as substantive (no indefinite blocking).
          CONCERNS="${CONCERNS:-}"
          SEARCH_PATTERN="$(printf '%s' "${CONCERNS}" | grep -oE '\"[^\"]+\"' | tr -d '\"' | sort -u | paste -sd '|' - || true)"
          echo "Search pattern extracted from feedback: '${SEARCH_PATTERN}'"

          TOUCHED=false
          REQUIRED_FILES="${REQUIRED_FILES:-}"
          if [ -n "${REQUIRED_FILES}" ] && [ "${REQUIRED_FILES}" != "[]" ]; then
            while IFS= read -r req; do
              [ -z "${req}" ] && continue
              if printf '%s\n' "${CHANGED}" | grep -qxF -- "${req}"; then
                TOUCHED=true
                break
              fi
            done <<EOF
          $(printf '%s' "${REQUIRED_FILES}" | jq -r '.[]')
          EOF
          fi

          if [ "${TOUCHED}" = "true" ]; then
            echo "non_substantive=false" >> "$GITHUB_OUTPUT"
            echo "Revision is substantive — at least one flagged file was modified."
          elif [ -z "${REQUIRED_FILES}" ] || [ "${REQUIRED_FILES}" = "[]" ]; then
            echo "non_substantive=false" >> "$GITHUB_OUTPUT"
            echo "No specific files were flagged in review feedback. Skipping substantive check."
          else
            # None of the flagged files were modified. Test whether they still
            # contain the problematic content referenced in the Gate 1 feedback.
            # Files that no longer contain the search terms are "already clean"
            # and must not cause the revision to be declared non-substantive.
            STILL_DIRTY=()
            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              if [ -n "${SEARCH_PATTERN}" ] && grep -qiE -- "${SEARCH_PATTERN}" "$f" 2>/dev/null; then
                STILL_DIRTY+=("$f")
              fi
            done < <(printf '%s' "${REQUIRED_FILES}" | jq -r '.[]')

            if [ ${#STILL_DIRTY[@]} -eq 0 ]; then
              echo "non_substantive=false" >> "$GITHUB_OUTPUT"
              echo "All flagged files are either modified or already clean."
            else
              echo "non_substantive=true" >> "$GITHUB_OUTPUT"
              echo "Revision is NON-SUBSTANTIVE — flagged files still contain problematic content:"
              printf '%s\n' "${STILL_DIRTY[@]}"
            fi
          fi

      - name: Block PR — non-substantive revision
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true' &&
          steps.substantive.outputs.non_substantive == 'true'
        uses: actions/github-script@v7
        env:
          REQUIRED_FILES: ${{ steps.feedback_parse.outputs.required_files }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');
            let requiredFiles = [];
            try {
              requiredFiles = JSON.parse(process.env.REQUIRED_FILES || '[]');
            } catch (e) {
              core.warning(`Could not parse REQUIRED_FILES: ${e.message}`);
            }

            // Apply the blocking label so future CHANGES_REQUESTED runs exit early.
            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber,
                labels: ['blocked:non-substantive']
              });
            } catch (e) {
              core.warning(`Could not add blocked:non-substantive label: ${e.message}`);
            }

            const fileList = requiredFiles.length
              ? requiredFiles.map(f => `- \`${f}\``).join('\n')
              : '- (none extracted)';

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: [
                '<!-- AGENT_REVISE_NON_SUBSTANTIVE -->',
                '🚫 **This revision does not address the requested file changes.**',
                '',
                'Gate 1 feedback requested changes to:',
                fileList,
                '',
                'The agent\'s commits did not modify any of those files, so this revision cycle',
                'was **not counted** against the revision quota.',
                '',
                'The PR has been labelled `blocked:non-substantive`. An admin must remove the',
                'label before further automatic revision cycles can run.'
              ].join('\n')
            });

      - name: Increment revision cycle label
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true' &&
          steps.substantive.outputs.non_substantive == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');

            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: prNumber, per_page: 100
            });
            const CYCLE_RE = /^revision-cycle:(\d+)$/;
            const current = labels
              .map(l => (l.name || '').match(CYCLE_RE))
              .filter(Boolean)
              .map(m => parseInt(m[1], 10))
              .sort((a, b) => b - a)[0] || 0;

            const next = current + 1;
            const nextLabel = `revision-cycle:${next}`;

            // Remove any existing revision-cycle labels, then apply the incremented one.
            for (const l of labels) {
              if (CYCLE_RE.test(l.name || '')) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: l.name });
                } catch (e) {
                  core.warning(`Could not remove label ${l.name}: ${e.message}`);
                }
              }
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber,
              labels: [nextLabel]
            });
            core.info(`Incremented revision cycle label to ${nextLabel}`);

      - name: Post revision summary comment
        if: >
          steps.cycle_guard.outputs.escalate != 'true' &&
          steps.blocked_check.outputs.blocked != 'true' &&
          steps.concerns.outputs.no_concerns != 'true' &&
          steps.feedback_parse.outputs.no_files != 'true' &&
          steps.substantive.outputs.non_substantive != 'true'
        uses: actions/github-script@v7
        env:
          CONCERNS: ${{ steps.concerns.outputs.concerns }}
          DIFF_SUMMARY: ${{ steps.actual_diff.outputs.diff_summary }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.meta.outputs.pr_number }}');
            const preSha = '${{ steps.pre_push_sha.outputs.pre_push_sha }}';
            const postSha = '${{ steps.actual_diff.outputs.post_sha }}';
            const diffSummary = process.env.DIFF_SUMMARY || 'No diff captured.';
            const concerns = process.env.CONCERNS || '';

            const changesSection = preSha === postSha
              ? 'No file changes were committed this revision cycle (no-op).'
              : `\`\`\`diff\n${diffSummary}\n\`\`\``;

            const body = [
              '<!-- AGENT_PR_REVISED -->',
              `**Revision complete** — HEAD: \`${postSha.slice(0,7)}\``,
              '',
              '**Changes made:**',
              changesSection,
              '',
              '<details><summary>Review concerns that were addressed</summary>',
              '',
              concerns,
              '',
              '</details>',
              '',
              'The CI + review cycle will re-run automatically.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body
            });
