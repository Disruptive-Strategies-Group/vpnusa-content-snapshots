name: Secret Scan
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    # Weekly full-history report (non-blocking, see job below)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    # Blocking check: scans only the commits introduced by the push/PR so that
    # historical findings cannot fail every future PR.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
      - name: Run gitleaks detect (PR range)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./gitleaks detect --source . --config .gitleaks.toml --verbose \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"
      - name: Run gitleaks detect (push range)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            ./gitleaks detect --source . --config .gitleaks.toml --verbose \
              --log-opts="-1 ${AFTER_SHA}"
          else
            ./gitleaks detect --source . --config .gitleaks.toml --verbose \
              --log-opts="${BEFORE_SHA}..${AFTER_SHA}"
          fi

  full-history-report:
    # Scheduled / manual full-history scan. Reports only; not a required check.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
      - name: Run gitleaks detect (full history, report only)
        run: |
          ./gitleaks detect --source . --config .gitleaks.toml --verbose
