name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/code-agent.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/lifecycle-bootstrap.yml'
      - '.github/workflows/issue-deploy-lifecycle.yml'
      - '.github/workflows/sam-deploy.yml'
      - '.github/workflows/ec2-deploy.yml'
      - '.github/workflows/terraform-deploy.yml'
      - '.github/workflows/validate-pr-no-ci-skip.yml'
      - '.github/workflows/agent-pr-ci-summary.yml'
      - '.github/WORKFLOW_LIFECYCLE.md'
      - '.github/deploy-lifecycle.core.json'
      - '.github/deploy-lifecycle.overlay.json'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.devcontainer/**'
      - '.amazonq/**'
      - 'docs/agent-rules.md'
      - '.pre-commit-config.yaml'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Upgrade pip
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        run: python -m pip install -U pip

      - name: Install runtime dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Install dev/test dependencies
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          else
            pip install pytest
          fi

      - name: Run pytest
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        run: python -m pytest

      - name: CI bootstrap check
        if: hashFiles('requirements.txt') == '' && hashFiles('pyproject.toml') == ''
        run: echo "CI check registered (non-Python repo)"

  flyway-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if Flyway files changed
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q 'flyway/sql/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Flyway migration files
        if: steps.filter.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXIT_CODE=0

          for f in flyway/sql/*.sql; do
            [ -f "$f" ] || continue
            echo "Checking $f ..."

            # Check 1: Reject any reference to flyway_schema_history
            if grep -qi 'flyway_schema_history' "$f"; then
              echo "ERROR: $f references flyway_schema_history. Flyway locks this table during every migration."
              echo " ALTER TABLE ... OWNER TO or any DDL on flyway_schema_history will deadlock."
              EXIT_CODE=1
            fi

            # Check 2: Require SET lock_timeout before any DDL statement
            # DDL statements: ALTER TABLE, DROP TABLE, CREATE INDEX, REINDEX, TRUNCATE, ALTER INDEX
            if grep -qiE '(ALTER\s+TABLE|DROP\s+TABLE|CREATE\s+INDEX|REINDEX|TRUNCATE|ALTER\s+INDEX)' "$f"; then
              if ! grep -qi 'SET\s+lock_timeout' "$f"; then
                echo "ERROR: $f contains DDL statements but no 'SET lock_timeout'."
                echo " DDL without lock_timeout can hang indefinitely if a lock is held."
                echo " Add 'SET lock_timeout = '30s';' (or similar) before any DDL statement."
                EXIT_CODE=1
              fi
            fi

            # Check 3: Flag bulk ownership transfers (high blast radius)
            # Count occurrences of OWNER TO — more than 5 suggests a bulk transfer loop
            OWNER_COUNT=$(grep -ciE '(ALTER\s+TABLE|ALTER\s+SEQUENCE|ALTER\s+SCHEMA).*OWNER\s+TO' "$f" || true)
            if [ "$OWNER_COUNT" -gt 5 ]; then
              echo "WARNING: $f contains $OWNER_COUNT ownership transfer statements."
              echo " Bulk ownership transfers are high-blast-radius operations."
              echo " Consider whether this can be scoped more narrowly."
              EXIT_CODE=1
            fi
          done

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Flyway lint checks failed. See errors above."
            exit 1
          fi
          echo "All Flyway migration files passed lint checks."
